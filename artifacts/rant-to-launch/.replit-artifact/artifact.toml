kind = "web"
previewPath = "/"
title = "Rant-to-Launch"
version = "1.0.0"
id = "artifacts/rant-to-launch"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 5000

[services.development]
run = "pnpm --filter @workspace/rant-to-launch run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/rant-to-launch", "run", "build" ]
publicDir = "artifacts/rant-to-launch/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "5000"
BASE_PATH = "/"
