openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: audio
    description: Runtime audio generation operations
  - name: projects
    description: Project, source-input, generation-run, and asset-card operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /audio/tts:
    post:
      operationId: createTts
      tags: [audio]
      summary: Generate a short voiceover preview
      description: |
        Generates an MP3 voiceover preview for a storyboard frame using
        Replit-managed OpenAI audio. Intended for short, founder-authored
        storyboard voiceover lines; long narration exports are out of scope.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTtsBody"
      responses:
        "200":
          description: MP3 audio bytes
          content:
            audio/mpeg:
              schema:
                type: string
                format: binary
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too many voiceover previews
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Speech generation failed upstream
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /projects:
    post:
      operationId: createProject
      tags: [projects]
      summary: Create a new launch project from a rant (async)
      description: |
        Creates a new project + source input + generation run + generation
        job in a single transaction, enqueues the heavy generation pipeline
        (OpenAI text + 11 image calls) on an in-process worker, and returns
        202 immediately with the projectId, slug, and jobId so the client
        can poll GET /api/jobs/{jobId} for progress and final status.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectBody"
      responses:
        "202":
          description: Project + job created; generation runs asynchronously
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateProjectAccepted"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Failed to enqueue generation job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /jobs/{jobId}:
    get:
      operationId: getGenerationJob
      tags: [projects]
      summary: Read the current state of a generation job
      description: |
        Returns the latest snapshot of a generation_jobs row so a polling
        client can render progress (current step, done/total counters)
        and react to terminal states (succeeded → refetch project,
        failed → show error_message).
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The current job snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerationJob"
        "404":
          description: Job not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /projects/{slug}:
    get:
      operationId: getProject
      tags: [projects]
      summary: Get a project by slug
      description: Returns the full project detail (project + source inputs + runs + asset cards).
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The project detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectDetail"
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateProject
      tags: [projects]
      summary: Rename a project
      description: |
        Updates the project's display name. Only the `name` field is
        editable via this endpoint. Returns the updated project record.
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProjectBody"
      responses:
        "200":
          description: The updated project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteProject
      tags: [projects]
      summary: Delete a project
      description: |
        Permanently deletes the project and cascades to remove its source
        inputs, generation runs, asset cards, and share links. Returns 204
        on success. Idempotent on a missing project — returns 404.
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: The project was deleted
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /projects/{slug}/asset-cards/{cardId}:
    patch:
      operationId: updateAssetCard
      tags: [projects]
      summary: Update an asset card's content
      description: |
        Persists founder edits to an asset card's `content` payload.
        The provided `content` must conform to the shape defined by the
        card's `kind` (see AssetCardKind). Returns the updated asset card.
        `imageUrl` fields on carousel slides and storyboard frames are
        preserved automatically — clients may omit them and the server
        will keep the existing values.
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
        - name: cardId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAssetCardBody"
      responses:
        "200":
          description: The updated asset card
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetCard"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Project or asset card not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /projects/{slug}/asset-cards/{cardId}/undo:
    post:
      operationId: undoAssetCard
      tags: [projects]
      summary: Undo the most recent change to an asset card
      description: |
        Restores the asset card's `content` to the snapshot that was captured
        the last time the card was edited (PATCH) or regenerated (POST
        sections). Each card keeps a single prior version, so undo is
        available for at most the most recent change. After a successful
        undo, the snapshot is cleared (so calling undo a second time in a
        row will return 409). Returns the updated asset card.
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
        - name: cardId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The asset card after the undo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetCard"
        "404":
          description: Project or asset card not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Nothing to undo (no prior version available)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /projects/{slug}/share-link:
    post:
      operationId: createShareLink
      tags: [projects]
      summary: Mint or fetch a shareable read-only link
      description: |
        Returns the active shareable read-only link for the project,
        creating one if none exists. Each project has at most one active
        link at a time; calling this endpoint while a link already exists
        returns the existing token (no new mint). The token can be opened
        by anyone via `GET /api/public/projects/{token}`.
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The active share link for the project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShareLink"
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: revokeShareLink
      tags: [projects]
      summary: Revoke the active shareable link
      description: |
        Revokes any currently-active shareable read-only link for the
        project. After revocation the public URL returns 404. Idempotent —
        revoking when no active link exists is a no-op.
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: The link was revoked (or no link was active)
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /public/projects/{token}:
    get:
      operationId: getPublicProject
      tags: [projects]
      summary: Read-only public view of a project via share token
      description: |
        Resolves a share token minted by POST
        /projects/{slug}/share-link to the underlying project's full
        detail (project + source inputs + runs + asset cards). Intended
        for unauthenticated read-only viewing. Revoked tokens return 404.
        The response omits the active share token to avoid leaking it.
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The public project detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectDetail"
        "404":
          description: Token not found or revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /projects/{slug}/sections/landing_page_copy/faq:
    post:
      operationId: backfillLandingFaq
      tags: [projects]
      summary: Generate just the FAQ block for an existing landing page card
      description: |
        Backfills the FAQ block onto an existing landing card without
        rewriting the headline, subheadline, CTA, features, or social
        proof. Intended for landing cards generated before the FAQ block
        existed (or where the founder removed FAQ during an edit).

        Uses the project's most recent source input (rant + intake
        context) plus the existing landing copy as context for an
        FAQ-only OpenAI call. The new 4-6 entry FAQ array is merged onto
        the existing payload, the previous content is snapshotted for
        Undo, and the updated asset card is returned.

        Returns 404 if the landing card does not yet exist — call the
        full regenerateSection endpoint to create one first.
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The updated landing asset card with the new FAQ block
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetCard"
        "404":
          description: Project, source input, or landing card not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: FAQ generation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /projects/{slug}/sections/storyboard_cards/refresh-images:
    post:
      operationId: refreshStoryboardImages
      tags: [projects]
      summary: Re-run only image generation for the storyboard, preserving text
      description: |
        Regenerates one PNG per storyboard frame using the current frame
        text (hook, visual, on-screen text, voiceover) as input to the
        richer image-prompt builder. Existing frame copy is preserved
        untouched — only the `imageUrl` field on each frame is updated.

        Useful for projects whose storyboard images were generated by an
        older, visual-only image prompt: founders can refresh just the
        artwork without re-rolling the storyboard text. Per-image
        failures fall back to the previous imageUrl on that frame, so a
        partial failure still leaves the founder with usable art.

        Snapshots `previousContent` so the founder can Undo the refresh
        and recover the prior images. Returns 404 if the storyboard
        card does not yet exist.
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The updated storyboard asset card with refreshed image URLs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetCard"
        "404":
          description: Project or storyboard card not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Image refresh failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /projects/{slug}/sections/{section}:
    post:
      operationId: regenerateSection
      tags: [projects]
      summary: Regenerate a single section of a project
      description: |
        Regenerates one asset card (e.g. just the LinkedIn post) without
        re-running the whole launch package. Reuses the project's most
        recent source input (rant + intake context) to drive a per-section
        OpenAI call, persists the new payload onto the existing asset
        card row, and returns the updated card so the workspace can swap
        it in place.

        For visual sections (`carousel_outline`, `storyboard_cards`) the
        endpoint also regenerates one image per slide/frame via
        gpt-image-1; per-image failures fall back to text-only just like
        the initial generation.
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
        - name: section
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/AssetCardKind"
      responses:
        "200":
          description: The regenerated asset card
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetCard"
        "400":
          description: Invalid section name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Project or source input not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Regeneration failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        slug:
          type: string
          description: |
            Optional. Present on POST /projects 500 responses when a project row
            was created before the failure, so the client can deep-link to
            /projects/:slug to view the persisted error run.
      required:
        - error
    UpdateProjectBody:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: New display name for the project.
      required:
        - name
    SpeechVoice:
      type: string
      enum:
        - alloy
        - echo
        - fable
        - onyx
        - nova
        - shimmer
    SpeechFormat:
      type: string
      enum:
        - mp3
    CreateTtsBody:
      type: object
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 1000
          description: Short storyboard voiceover text to speak.
        voice:
          $ref: "#/components/schemas/SpeechVoice"
          description: Optional OpenAI voice. Defaults to onyx.
        format:
          $ref: "#/components/schemas/SpeechFormat"
          description: Optional output format. Defaults to mp3.
      required:
        - text
    UpdateAssetCardBody:
      type: object
      properties:
        content:
          type: object
          additionalProperties: true
          description: |
            Replacement payload for the asset card. Must match the shape
            for the card's `kind`. Image objectPaths on carousel slides
            and storyboard frames are preserved by the server when omitted.
      required:
        - content
    CreateProjectBody:
      type: object
      properties:
        rawText:
          type: string
          minLength: 1
          maxLength: 50000
          description: The pasted founder rant or transcript. Required.
        name:
          type: string
          maxLength: 200
          description: Optional project name. If omitted, derived from the rant.
        audience:
          type: string
          maxLength: 500
          description: |
            Optional. Who the launch is for (e.g. "solo SaaS founders", "product
            designers at agencies"). Used to sharpen positioning. If omitted, the
            model infers an audience from the rant.
        offer:
          type: string
          maxLength: 500
          description: |
            Optional. What is being offered (e.g. "free 14-day trial", "open beta
            invite"). Anchors the landing page CTA and posting plan.
        cta:
          type: string
          maxLength: 200
          description: |
            Optional. The single action you want readers to take (e.g. "Start
            your free trial"). Used verbatim in the landing page CTA when present.
        tone:
          type: string
          maxLength: 100
          description: |
            Optional. The voice the founder wants the copy to sound in. Free text
            (e.g. "founder-direct", "calm-confident", "bold and witty"). Defaults
            to founder-direct when omitted.
        channels:
          type: array
          maxItems: 10
          items:
            type: string
            maxLength: 50
          description: |
            Optional. Channels the founder plans to publish on. Recognized values
            are "x", "linkedin", "newsletter", "carousel"; unknown values are
            forwarded to the model verbatim. When provided, generation prioritizes
            the listed channels in the posting schedule.
        timestamps:
          type: string
          maxLength: 5000
          description: |
            Optional. Pasted timestamps or chapter markers from the source recording
            (e.g. "00:14 problem statement, 00:42 demo, 01:30 pricing"). Helps the
            model anchor specific sections.
      required:
        - rawText
    Project:
      type: object
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        description:
          oneOf:
            - type: string
            - type: "null"
        archivedAt:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - slug
        - name
        - description
        - archivedAt
        - createdAt
        - updatedAt
    SourceInput:
      type: object
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        kind:
          type: string
        title:
          oneOf:
            - type: string
            - type: "null"
        rawText:
          type: string
        metadata:
          oneOf:
            - type: object
              additionalProperties: true
              description: |
                Founder-supplied launch context captured at intake time
                (audience, offer, cta, tone, channels[], timestamps).
                Shape mirrors the optional fields on CreateProjectBody.
            - type: "null"
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - projectId
        - kind
        - title
        - rawText
        - metadata
        - createdAt
    CreateProjectAccepted:
      type: object
      description: |
        Returned by POST /projects (202). The client should redirect to the
        project workspace using `slug`, and poll GET /jobs/{jobId} for
        progress until the job is `succeeded` or `failed`.
      properties:
        projectId:
          type: string
          format: uuid
        slug:
          type: string
        jobId:
          type: string
          format: uuid
      required:
        - projectId
        - slug
        - jobId
    GenerationJobStatus:
      type: string
      enum:
        - queued
        - running
        - succeeded
        - failed
    GenerationJob:
      type: object
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/GenerationJobStatus"
        progressTotal:
          type: integer
          minimum: 0
          description: |
            Total work units the worker expects to complete. May be 0 until
            the worker has finished the text-generation phase and computed
            the per-image fan-out count.
        progressDone:
          type: integer
          minimum: 0
          description: |
            Work units completed so far. Reaches `progressTotal` when the
            job hits a terminal state (`succeeded`).
        currentStep:
          oneOf:
            - type: string
            - type: "null"
          description: |
            Human-readable label for the worker's current phase (e.g.
            "Generating launch copy", "Generating image 3/11", "Done").
        errorMessage:
          oneOf:
            - type: string
            - type: "null"
          description: |
            Set when status is `failed`. Clamped server-side to 4000 chars
            so a multi-MB upstream stack trace can never blow up the row.
        startedAt:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
        completedAt:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - projectId
        - status
        - progressTotal
        - progressDone
        - currentStep
        - errorMessage
        - startedAt
        - completedAt
        - createdAt
        - updatedAt
    GenerationRunStatus:
      type: string
      enum:
        - queued
        - running
        - done
        - error
    GenerationRun:
      type: object
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        sourceInputId:
          oneOf:
            - type: string
              format: uuid
            - type: "null"
        status:
          $ref: "#/components/schemas/GenerationRunStatus"
        model:
          oneOf:
            - type: string
            - type: "null"
        errorMessage:
          oneOf:
            - type: string
            - type: "null"
        startedAt:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
        completedAt:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - projectId
        - sourceInputId
        - status
        - model
        - errorMessage
        - startedAt
        - completedAt
        - createdAt
    AssetCardKind:
      type: string
      description: |
        Supported asset card kinds. The shape of `content` depends on `kind`:
        - launch_angle: { text: string }
        - x_thread: { tweets: string[] }
        - linkedin_post: { text: string }
        - carousel_outline: { slides: { slide: number, headline: string, body: string, imageUrl: string|null }[] }
        - newsletter_blurb: { text: string }
        - landing_page_copy: { headline, subheadline, cta, features[], socialProof, faq[] }
          where faq is an array of 4-6 { question, answer } entries. The faq
          field is OPTIONAL on PATCH for backward compatibility with landing
          cards generated before the FAQ block was introduced; new generations
          always include it.
        - storyboard_cards: { frames: { frame: number, hook: string, sourceMoment: string, visual: string, onScreenText: string, voiceover: string, cta: string, imageUrl: string|null }[] }
          where each frame is a complete shot list. `sourceMoment` is anchored to a recording timestamp (e.g. `02:14 — "..."`) when the founder supplied timestamps in intake; otherwise it is a section-based label like `Section: opening hook`. Storyboard cards generated before this richer contract may carry empty strings for the new fields and the legacy `caption` value mapped onto `voiceover`; PATCH validation requires every field to be non-empty.
        - posting_schedule: { entries: { day: string, platform: string, content: string }[] }
          where entries is exactly 7 launch-day slots in order. The `day`
          field uses the fixed slot labels "Launch", "+1 hour", "+3 hours",
          "+6 hours", "Next morning", "Next afternoon", "Final
          voting-window reminder". On READ the server passes through
          legacy "Day 1".."Day 7" labels untouched (older cards), but
          PATCH and Regenerate validate against the new fixed labels.
        `imageUrl` on carousel slides and storyboard frames is the objectPath
        (e.g. `/objects/launches/<slug>/storyboard/3-<uuid>.png`) of an image
        generated by gpt-image-1 and stored in object storage. It is `null`
        when the per-image generation call failed; clients should fall back to
        the text-only rendering in that case. Render via
        `GET /api/storage{objectPath}`.
      enum:
        - launch_angle
        - x_thread
        - linkedin_post
        - carousel_outline
        - newsletter_blurb
        - landing_page_copy
        - storyboard_cards
        - posting_schedule
    AssetCard:
      type: object
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        generationRunId:
          oneOf:
            - type: string
              format: uuid
            - type: "null"
        sourceInputId:
          oneOf:
            - type: string
              format: uuid
            - type: "null"
        kind:
          $ref: "#/components/schemas/AssetCardKind"
        title:
          oneOf:
            - type: string
            - type: "null"
        content:
          type: object
          additionalProperties: true
          description: Per-kind payload; see AssetCardKind for the shape per kind.
        position:
          type: integer
        pinned:
          type: boolean
        hasUndo:
          type: boolean
          description: |
            True when the server has a snapshot of the card's previous
            content available for undo (i.e. the card has been edited or
            regenerated at least once since the last undo). The snapshot
            itself is not returned — clients call POST
            /projects/{slug}/asset-cards/{cardId}/undo to restore it.
        archivedAt:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - projectId
        - generationRunId
        - sourceInputId
        - kind
        - title
        - content
        - position
        - pinned
        - hasUndo
        - archivedAt
        - createdAt
        - updatedAt
    ProjectDetail:
      type: object
      properties:
        project:
          $ref: "#/components/schemas/Project"
        sourceInputs:
          type: array
          items:
            $ref: "#/components/schemas/SourceInput"
        runs:
          type: array
          items:
            $ref: "#/components/schemas/GenerationRun"
        assetCards:
          type: array
          items:
            $ref: "#/components/schemas/AssetCard"
        activeShareToken:
          oneOf:
            - type: string
            - type: "null"
          description: |
            Token of the active shareable read-only link for this project,
            or null when no link has been minted (or the most recent one
            was revoked). Always null on responses returned via the public
            share endpoint to avoid leaking the token to unauthenticated
            viewers.
      required:
        - project
        - sourceInputs
        - runs
        - assetCards
        - activeShareToken
    ShareLink:
      type: object
      properties:
        token:
          type: string
          description: Opaque share token. Embed in `/share/{token}` to view publicly.
        url:
          type: string
          description: |
            Absolute URL for the public read-only workspace. Shareable to
            recipients without accounts.
        createdAt:
          type: string
          format: date-time
      required:
        - token
        - url
        - createdAt
